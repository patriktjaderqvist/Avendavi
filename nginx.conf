# Avendavi SPA — served from /usr/share/nginx/html by the unprivileged nginx
# image on port 8080. The shared Caddy reverse proxy on the `web` Docker
# network terminates TLS and forwards by Host header.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files (favicon, og-image, cv, photos…) — short cache, allow
    # revalidation.
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|pdf|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # HTML documents (the SPA shell and the prerendered per-route pages) must
    # never be cached — new deploys ship updated asset hashes and metadata.
    location ~ \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    -1;
    }

    # Crawler and manifest files — real files only, never the SPA fallback.
    location = /robots.txt {
        try_files    $uri =404;
        access_log   off;
    }

    location = /sitemap.xml {
        try_files    $uri =404;
        types        { }
        default_type application/xml;
    }

    location = /site.webmanifest {
        try_files    $uri =404;
        types        { }
        default_type application/manifest+json;
    }

    # Prerendered routes and SPA fallback. `$uri/index.html` (not `$uri/`)
    # serves /story from /story/index.html directly, without the 301
    # trailing-slash redirect the directory index would emit. Everything
    # served here is an HTML document, so it must never be cached.
    location / {
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    -1;
    }
}
