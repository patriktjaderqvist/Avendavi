# Avendavi SPA — served from /usr/share/nginx/html by the unprivileged nginx
# image on port 8080. The shared Caddy reverse proxy on the `web` Docker
# network terminates TLS and forwards by Host header.

server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Compression
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Hashed Vite assets — safe to cache aggressively.
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # Static files (favicon, og-image, cv, photos…) — short cache, allow
    # revalidation.
    location ~* \.(?:png|jpg|jpeg|gif|webp|svg|ico|pdf|woff2?|ttf|otf)$ {
        try_files $uri =404;
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # index.html must never be cached — new deploys ship updated asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires    -1;
    }

    # SPA fallback (was Vercel `{ "source": "/(.*)", "destination": "/" }`).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
